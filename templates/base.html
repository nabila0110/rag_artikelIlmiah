<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}RAG Artikel Ilmiah{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    {% block extra_css %}{% endblock %}
  </head>
  <body data-theme="dark">

    <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Ganti tema">
      <img src="{{ url_for('static', filename='images/sun-light.svg') }}" 
           alt="Light Mode" 
           class="theme-icon theme-icon-light">
      <img src="{{ url_for('static', filename='images/sun-dark.svg') }}" 
           alt="Dark Mode" 
           class="theme-icon theme-icon-dark">
    </button>

    <!-- main content -->
    <div class="container main-wrapper">{% block content %}{% endblock %}</div>

    <!-- footer -->
    <footer class="text-center py-4 mt-3">
      <div class="container">
        <p class="mb-0">Sistem RAG Artikel Ilmiah Berbahasa Indonesia</p>
        <p class="text-muted small">&copy2026 Nabila, Universitas Riau</p>
      </div>
    </footer>

    <div id="appMessageOverlay" class="app-message-overlay d-none" role="dialog" aria-modal="true" aria-labelledby="appMessageTitle">
      <div class="app-message-card">
        <div class="app-message-top">
          <span id="appMessageIcon" class="app-message-icon" aria-hidden="true">
            <i class="fas fa-circle-exclamation"></i>
          </span>
        </div>
        <div class="app-message-content text-center">
          <h4 id="appMessageTitle" class="mb-2">Pesan</h4>
          <p class="app-message-body mb-0" id="appMessageBody">Terjadi kesalahan.</p>
        </div>
        <div class="app-message-footer">
          <button type="button" class="btn btn-primary" id="appMessageOkBtn">OK</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block extra_js %}{% endblock %}

  </body>
</html>

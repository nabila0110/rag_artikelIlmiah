<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Sun core - bright gradient -->
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffc107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sun rays - flame style -->
  <g transform="translate(100,100)" filter="url(#glow)">
    <!-- 12 flame rays -->
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffd54f" transform="rotate(0)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffd54f" transform="rotate(30)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffb300" transform="rotate(60)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffd54f" transform="rotate(90)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffd54f" transform="rotate(120)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffb300" transform="rotate(150)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffd54f" transform="rotate(180)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffd54f" transform="rotate(210)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffb300" transform="rotate(240)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffd54f" transform="rotate(270)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffd54f" transform="rotate(300)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#ffb300" transform="rotate(330)"/>
  </g>
  
  <!-- Sun core circle -->
  <circle cx="100" cy="100" r="45" fill="url(#sunGradient)" filter="url(#glow)"/>
  
  <!-- Shine highlight -->
  <ellipse cx="90" cy="85" rx="15" ry="20" fill="rgba(255,255,255,0.4)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dark sun with glow -->
  <defs>
    <radialGradient id="darkSunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="darkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0" />
    </radialGradient>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow -->
  <circle cx="100" cy="100" r="70" fill="url(#darkGlow)" opacity="0.7"/>
  
  <!-- Moon/dark sun rays - flame style -->
  <g transform="translate(100,100)" filter="url(#outerGlow)">
    <!-- 12 flame rays with blue glow -->
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#4299e1" opacity="0.6" transform="rotate(0)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#4299e1" opacity="0.5" transform="rotate(30)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#5a67d8" opacity="0.6" transform="rotate(60)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#4299e1" opacity="0.5" transform="rotate(90)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#4299e1" opacity="0.6" transform="rotate(120)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#5a67d8" opacity="0.5" transform="rotate(150)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#4299e1" opacity="0.6" transform="rotate(180)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#4299e1" opacity="0.5" transform="rotate(210)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#5a67d8" opacity="0.6" transform="rotate(240)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#4299e1" opacity="0.5" transform="rotate(270)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#4299e1" opacity="0.6" transform="rotate(300)"/>
    <path d="M 0,-65 Q -8,-50 0,-45 Q 8,-50 0,-65" fill="#5a67d8" opacity="0.5" transform="rotate(330)"/>
  </g>
  
  <!-- Dark sun core -->
  <circle cx="100" cy="100" r="45" fill="url(#darkSunGradient)" filter="url(#outerGlow)"/>
  
  <!-- Subtle highlight -->
  <ellipse cx="90" cy="85" rx="12" ry="18" fill="rgba(96,165,250,0.2)"/>
</svg>
